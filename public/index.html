<style>
  :root{
    --ink: #0a0406;
    --malva: #180509;
    --pink: #ff1533;
    --pink-soft: #ff6e82;
    --lilac: #d46a85;
    --deep: #8e1e3f;
    --white: #fff4f6;

    --line: color-mix(in srgb, var(--pink) 20%, transparent);
    --line-strong: color-mix(in srgb, var(--pink) 45%, transparent);
    --grid-line: color-mix(in srgb, var(--pink) 9%, transparent);
    --glow: 0 0 12px color-mix(in srgb, var(--pink) 80%, transparent), 0 0 32px color-mix(in srgb, var(--pink) 35%, transparent);
    --glow-soft: 0 0 16px color-mix(in srgb, var(--pink) 45%, transparent);

    --font-display: 'Rubik Glitch', cursive;
    --font-serif: 'Playfair Display', serif;
    --font-sans: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html{ background: var(--ink); }

  body{
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3.5rem 1.15rem 3rem;
    font-family: var(--font-sans);
    color: var(--white);
    background-color: var(--ink);
    background-image:
      radial-gradient(ellipse 78% 46% at 50% -6%, color-mix(in srgb, var(--deep) 70%, transparent) 0%, transparent 72%),
      radial-gradient(ellipse 62% 34% at 50% 34%, color-mix(in srgb, var(--pink) 13%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 110% 46% at 50% 112%, color-mix(in srgb, var(--deep) 34%, transparent) 0%, transparent 72%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- fondo: rejilla y partículas ---------- */
  .grid-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse 72% 62% at 50% 42%, #000 0%, transparent 88%);
    mask-image: radial-gradient(ellipse 72% 62% at 50% 42%, #000 0%, transparent 88%);
  }

  .spark-layer{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .cursor-star{
    position: absolute;
    width: var(--star-size);
    aspect-ratio: 1;
    translate: -50% -50%;
    color: var(--star-color);
    filter: drop-shadow(0 0 5px currentColor);
    animation: cursor-spark .65s ease-out both;
  }

  .cursor-star::before{
    content: '';
    display: block;
    width: 100%;
    height: 100%;
    background: currentColor;
    clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
  }

  @keyframes cursor-spark{
    from{ transform: rotate(var(--star-turn)); opacity: .95; }
    to{ transform: translate(var(--star-drift), 19px) rotate(calc(var(--star-turn) + 65deg)) scale(.15); opacity: 0; }
  }

  .spark{
    position: absolute;
    border-radius: 1px;
    background: var(--pink);
    box-shadow: 0 0 7px color-mix(in srgb, var(--pink) 90%, transparent);
    opacity: 0;
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes twinkle{
    0%, 100%{ opacity: 0; transform: scale(.6); }
    45%{ opacity: .9; transform: scale(1); }
    60%{ opacity: .35; }
  }

  /* ---------- columna ---------- */
  .wrap{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 25rem;
    text-align: center;
  }

  /* ---------- avatar ---------- */
  .avatar{
    position: relative;
    width: clamp(8.5rem, 30vw, 10.5rem);
    aspect-ratio: 1;
    margin: 0 auto;

  .avatar-svg{
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 9999px;
    box-shadow:
      0 0 0 1px var(--line-strong),
      0 0 26px color-mix(in srgb, var(--pink) 45%, transparent),
      0 0 64px color-mix(in srgb, var(--pink) 18%, transparent);
  }

  .avatar-img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 9999px;
    object-fit: cover;
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }

  .avatar-img.is-loaded{ opacity: 1; }

  .avatar.has-photo .avatar-letter{ display: none; }

  .avatar-letter{
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding-bottom: .3rem;
    font-family: var(--font-display);
    font-size: clamp(3.8rem, 16vw, 5rem);
    line-height: 1;
    color: var(--white);
    text-shadow:
      0 0 16px color-mix(in srgb, var(--pink) 85%, transparent),
      0 0 44px color-mix(in srgb, var(--pink) 45%, transparent);
    pointer-events: none;
  }

  .avatar-heart{
    position: absolute;
    left: 50%;
    bottom: -0.5rem;
    translate: -50% 0;
    display: grid;
    place-items: center;
    width: 1.95rem;
    height: 1.95rem;
    border-radius: 9999px;
    background: var(--malva);
    box-shadow: 0 0 0 1px var(--line), var(--glow-soft);
  }

  .avatar-heart svg{
    width: 0.95rem;
    height: 0.95rem;
    fill: var(--pink);
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--pink) 80%, transparent));
  }

  /* ---------- nombre ---------- */
  .name{
    position: relative;
    display: inline-block;
    margin: 1.5rem 0 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.2rem, 10vw, 2.75rem);
    line-height: 1.05;
    letter-spacing: .015em;
    color: var(--white);
    text-shadow:
      0 0 18px color-mix(in srgb, var(--pink) 70%, transparent),
      0 0 46px color-mix(in srgb, var(--pink) 28%, transparent);
    animation: flicker 11s infinite;
  }

  .name::before,
  .name::after{
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .name::before{
    color: var(--deep);
    transform: translate(-1.5px, 1px);
    clip-path: inset(0 0 58% 0);
    opacity: .85;
  }

  .name::after{
    color: var(--pink-soft);
    transform: translate(1.5px, -1px);
    clip-path: inset(52% 0 0 0);
    opacity: .55;
  }

  @keyframes flicker{
    0%, 91%, 100%{ opacity: 1; }
    92%{ opacity: .68; }
    93%{ opacity: 1; }
    96%{ opacity: .86; }
    97%{ opacity: 1; }
  }

  .tagline{
    margin: .55rem 0 0;

    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 4.2vw, 1.3rem);

    text-shadow: 0 0 14px color-mix(in srgb, var(--pink) 30%, transparent);
  }

  /* ---------- esquinas ---------- */

      linear-gradient(var(--corner-color), var(--corner-color)),

      linear-gradient(var(--corner-color), var(--corner-color)),
      linear-gradient(var(--corner-color), var(--corner-color));
    background-repeat: no-repeat;
    background-size:
      .8rem 1px, 1px .8rem,
      .8rem 1px, 1px .8rem,
      .8rem 1px, 1px .8rem,
      .8rem 1px, 1px .8rem;
    background-position:
      0 0, 0 0,
      100% 0, 100% 0,
      0 100%, 0 100%,
      100% 100%, 100% 100%;
  }

  /* ---------- tarjeta en directo ---------- */
  .live{
    display: flex;
    align-items: center;
    gap: .85rem;
    width: 100%;
    margin-top: 1.5rem;
    padding: .8rem .95rem;
    border: 1px solid var(--line-strong);
    border-radius: .85rem;
    text-align: left;
    text-decoration: none;
    color: inherit;
    background:
      linear-gradient(100deg,
        color-mix(in srgb, var(--malva) 94%, transparent) 0%,
        color-mix(in srgb, var(--pink) 11%, var(--ink)) 100%);
    box-shadow:
      0 0 26px color-mix(in srgb, var(--pink) 13%, transparent),
      inset 0 0 34px color-mix(in srgb, var(--pink) 6%, transparent);
    transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
  }

  .live:hover,
  .live:focus-visible{
    border-color: var(--pink);
    box-shadow:
      0 0 30px color-mix(in srgb, var(--pink) 30%, transparent),
      inset 0 0 34px color-mix(in srgb, var(--pink) 10%, transparent);
    transform: translateY(-1px);
  }

  .live-icon{
    display: grid;
    place-items: center;
    width: 2.5rem;
    height: 2.5rem;
    flex: none;
    border: 1px solid var(--line);
    border-radius: .55rem;
    background: color-mix(in srgb, var(--pink) 12%, transparent);
    color: var(--pink);
    box-shadow: inset 0 0 14px color-mix(in srgb, var(--pink) 18%, transparent);
  }

  .live-icon svg{
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
    filter: drop-shadow(0 0 6px color-mix(in srgb, var(--pink) 65%, transparent));
  }

  .live-text{
    flex: 1 1 auto;
    min-width: 0;
  }

  .live-top{
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .92rem;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--white);
  }

  .pill-live{
    display: none;
    padding: .12rem .38rem;
    border-radius: .22rem;
    background: var(--pink);
    color: #fff;
    font-size: .55rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: var(--glow-soft);
  }

  .live-sub{
    margin-top: .12rem;
    font-size: .78rem;
    color: var(--lilac);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .live-chevron{
    flex: none;
    width: 1rem;
    height: 1rem;
    stroke: var(--lilac);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .25s ease, stroke .25s ease;
  }

  .live:hover .live-chevron,
  .live:focus-visible .live-chevron{
    stroke: var(--pink);
    transform: translateX(3px);
  }

  /* ---------- estado del directo ---------- */
  body.live .pill-live{ display: inline-block; }

  body.live .social-tag{ display: inline-block; }

  body.live .live-icon svg{
    animation: livePulse 2.6s ease-in-out infinite;
  }

  @keyframes livePulse{
    0%, 100%{ filter: drop-shadow(0 0 6px color-mix(in srgb, var(--pink) 60%, transparent)); }
    50%{ filter: drop-shadow(0 0 13px color-mix(in srgb, var(--pink) 95%, transparent)); }
  }

  body.offline .live{
    border-color: var(--line);
    background: linear-gradient(100deg,
      color-mix(in srgb, var(--malva) 96%, transparent) 0%,
      color-mix(in srgb, var(--deep) 10%, var(--ink)) 100%);
    box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 6%, transparent);
  }

  body.offline .live-icon{
    color: var(--lilac);
    background: color-mix(in srgb, var(--pink) 6%, transparent);
    box-shadow: none;
  }

  body.offline .live-icon svg{ filter: none; }

  body.offline .live-top{ color: var(--lilac); }

  body.offline .live-chevron{ stroke: color-mix(in srgb, var(--lilac) 65%, transparent); }

  /* ---------- marquesina ---------- */
  .marquee{
    position: relative;
    margin-top: 1.7rem;
    padding: .5rem 0;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
  }

  .marquee-track{
    display: flex;
    width: max-content;
    animation: slide 26s linear infinite;
  }

  .marquee-track span{
    padding-right: 2.2rem;
    font-family: var(--font-mono);

    letter-spacing: .2em;
    color: color-mix(in srgb, var(--pink-soft) 78%, transparent);
    white-space: nowrap;
  }

  @keyframes slide{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ---------- redes ---------- */
  .socials{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.9rem;
    margin-top: 2.1rem;
  }

  .social{

    display: inline-grid;

  .social svg{

  .social:hover,

  }

  .social-tag{
    position: absolute;
    display: none;
    top: -.85rem;

    padding: .08rem .26rem;
    border-radius: .18rem;
    background: var(--pink);
    color: #fff;
    font-size: .44rem;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1.3;
    filter: none;
  }

  /* ---------- visitas ---------- */
  .views{
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    margin-top: 2.3rem;
    padding: .5rem 1rem;
    font-family: var(--font-mono);
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--pink-soft);
  }

  .views svg{
    width: .95rem;
    height: .95rem;
    fill: none;
    stroke: var(--pink);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 5px color-mix(in srgb, var(--pink) 70%, transparent));
  }

  .views b{
    font-weight: 500;
    color: var(--white);
    letter-spacing: .1em;
  }

  .views[hidden]{ display: none; }

  .music{

    background-color: color-mix(in srgb, var(--malva) 85%, transparent);
    text-align: left;
  }

  .music-controls{

    grid-template-columns: auto minmax(0, 1fr) minmax(3.6rem, 5.5rem);

  }

  .music-toggle{
    position: relative;
    width: 2.75rem;
    height: 2.75rem;

    color: var(--pink-soft);
    background: var(--ink);

  .music-toggle svg{

  }

  .music-toggle svg[hidden], .music-toggle:disabled svg{ display: none; }

  .music-toggle:not(:disabled):hover{

  .music-volume:disabled{ opacity: .5; }
  .music-toggle:focus-visible, .music-volume:focus-visible{

  }

  .music-track{

    line-height: 1.25;
  }

  .music-track:hover{ color: var(--pink-soft); }

  .music-track span{

    margin-top: .2rem;

    font-family: var(--font-mono);

  }

  .music-volume{

    min-width: 0;
    height: 1.5rem;

  .music-volume::-webkit-slider-thumb{

    width: .7rem;
    height: .7rem;

  }

  .music-volume::-moz-range-thumb{
    width: .7rem;
    height: .7rem;
    border: 1px solid var(--pink-soft);
    border-radius: 0;
    background: var(--pink);
    box-shadow: var(--glow-soft);
  }

  .music-volume:not(:disabled){ cursor: pointer; }

  .music-cover{
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .music-status{
    margin: .65rem 0 0;
    color: var(--pink-soft);

  }

  /* ---------- texto lateral ---------- */
  .side-text{

    right: .45rem;

    font-family: var(--font-mono);

  }

  @media (prefers-reduced-motion: reduce){
    .cursor-star{ display: none; }
    *, *::before, *::after{

<script>
  // Foto del avatar: sale de su perfil de X y cambia cuando ella la cambie
  (function () {
    var avatar = document.querySelector('.avatar');
    var img = document.querySelector('.avatar-img');
    if (!avatar || !img) return;
    function show() {
      img.classList.add('is-loaded');
      avatar.classList.add('has-photo');
    }
    img.addEventListener('load', show);
    img.addEventListener('error', function () { img.remove(); });
    if (img.complete && img.naturalWidth > 0) show();
  })();

  // Estado del directo y espectadores de Twitch. Se actualizan cada minuto.
  (function () {
    var card = document.querySelector('[data-live-card]');
    var views = document.querySelector('[data-views]');
    if (!card || !views) return;
    var title = card.querySelector('[data-live-title]');
    var sub = card.querySelector('[data-live-sub]');
    var count = views.querySelector('[data-views-count]');
    var label = views.querySelector('[data-views-label]');
    var body = document.body;

    function setLive(game, viewers) {
      if (!Number.isSafeInteger(viewers) || viewers < 0) throw new Error('espectadores inválidos');
      body.classList.add('live');
      body.classList.remove('offline');
      if (title) title.textContent = 'en directo';
      if (sub) sub.textContent = game ? 'jugando ' + game + ' ♡' : 'en vivo ahora ♡';
      count.textContent = viewers.toLocaleString('es-MX');
      label.textContent = viewers === 1 ? 'espectador' : 'espectadores';
      views.hidden = false;
    }

    function setOffline() {
      body.classList.add('offline');
      body.classList.remove('live');
      if (title) title.textContent = 'offline';
      if (sub) sub.textContent = 'vuelve pronto ♡';
      views.hidden = true;
    }

    async function askTwitch() {
      var query = '{ user(login:"andypii_"){ stream { viewersCount game { name } } } }';
      var response = await fetch('https://gql.twitch.tv/gql', {
        method: 'POST',
        headers: { 'Client-ID': 'kimne78kx3ncx6brgo4mv6wki5h1ko', 'Content-Type': 'text/plain' },
        body: JSON.stringify({ query: query }),
        signal: AbortSignal.timeout(10000)
      });
      if (!response.ok) throw new Error('Twitch: ' + response.status);
      var json = await response.json();
      var stream = json?.data?.user?.stream;
      if (stream === null) setOffline();
      else if (stream) setLive(stream.game?.name, stream.viewersCount);
      else throw new Error('Twitch: sin datos del directo');
    }

    async function askBackup() {
      var response = await fetch('https://decapi.me/twitch/viewercount/andypii_', {
        cache: 'no-store',
        signal: AbortSignal.timeout(10000)
      });
      if (!response.ok) throw new Error('DecAPI: ' + response.status);
      var result = (await response.text()).trim();
      if (/^andypii_ is offline$/i.test(result)) setOffline();
      else if (/^\d+$/.test(result)) setLive(null, Number(result));
      else throw new Error('DecAPI: sin datos de espectadores');
    }

    function check() {
      askTwitch().catch(function () {
        askBackup().catch(function () { views.hidden = true; });
      });
    }

    check();
    setInterval(check, 60000);
  })();

  // Partículas del fondo
  (function () {
    var layer = document.querySelector('[data-sparks]');
    if (!layer) return;
    var small = window.matchMedia('(max-width: 480px)').matches;
    var total = small ? 16 : 30;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < total; i++) {
      var dot = document.createElement('span');
      dot.className = 'spark';
      var size = (Math.random() * 2 + 1.4).toFixed(2);
      dot.style.left = (Math.random() * 100).toFixed(2) + '%';
      dot.style.top = (Math.random() * 100).toFixed(2) + '%';
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.animationDuration = (5 + Math.random() * 7).toFixed(2) + 's';
      dot.style.animationDelay = (-Math.random() * 9).toFixed(2) + 's';
      frag.appendChild(dot);
    }
    layer.appendChild(frag);
  })();

  (() => {
    const trail = document.querySelector('[data-cursor-trail]');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let lastSpark = -Infinity;

    function leaveStar(point) {
      const now = performance.now();
      if (!point || reducedMotion.matches || now - lastSpark < 22) return;
      lastSpark = now;

      const star = document.createElement('span');
      star.className = 'cursor-star';
      star.style.left = (point.clientX + Math.random() * 12 - 6) + 'px';
      star.style.top = (point.clientY + Math.random() * 12 - 6) + 'px';
      star.style.setProperty('--star-size', (6 + Math.random() * 10) + 'px');
      star.style.setProperty('--star-turn', Math.random() * 90 + 'deg');
      star.style.setProperty('--star-drift', (Math.random() * 22 - 11) + 'px');
      star.style.setProperty('--star-color', Math.random() < .5 ? 'var(--pink)' : 'var(--pink-soft)');
      star.addEventListener('animationend', () => star.remove(), { once: true });
      trail.append(star);
    }

    window.addEventListener('pointermove', event => {
      if (event.pointerType !== 'touch') leaveStar(event);
    }, { passive: true });
    window.addEventListener('touchmove', event => leaveStar(event.touches[0]), { passive: true });
    reducedMotion.addEventListener('change', () => trail.replaceChildren());
  })();

</script>
